name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          
      - name: Generate app icon
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK encontrado: $APK"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/ProteKids-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProteKids-debug-apk
          path: dist/ProteKids-debug.apk
          if-no-files-found: error
